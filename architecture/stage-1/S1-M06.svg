<text x="60" y="1160.0" text-anchor="start" font-family="Arial,sans-serif" font-size="14" fill="#64748b">Blue: user interface   Green: application   Yellow: data   Purple: infrastructure   Red: control / policy   Dashed: asynchronous event</text>
