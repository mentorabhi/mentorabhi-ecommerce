name: supersports
x-app-environment: &app-environment
  JAVA_TOOL_OPTIONS: "-Xms64m -Xmx192m -XX:MaxMetaspaceSize=160m"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "3000"
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "http://localhost:8180/realms/supersports"
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "http://identity:8080/realms/supersports/protocol/openid-connect/certs"

x-app-runtime: &app-runtime
  restart: unless-stopped
  mem_limit: 512m
  cpus: 1.0
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=67108864
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  stop_grace_period: 30s
  depends_on:
    postgres: {condition: service_healthy}
    identity: {condition: service_healthy}

services:
  postgres:
    image: "${POSTGRES_IMAGE:?Use devops/scripts/supersports}"
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=4", "-c", "max_replication_slots=4"]
    restart: unless-stopped
    mem_limit: 384m
    cpus: 1.0
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Run configure}"
      POSTGRES_DB: postgres
      CATALOG_DB_PASSWORD: "${CATALOG_DB_PASSWORD:?Run configure}"
      CONFIGURATION_DB_PASSWORD: "${CONFIGURATION_DB_PASSWORD:?Run configure}"
      IDENTITY_DB_PASSWORD: "${IDENTITY_DB_PASSWORD:?Run configure}"
      PRICING_DB_PASSWORD: "${PRICING_DB_PASSWORD:?Run configure}"
      INVENTORY_DB_PASSWORD: "${INVENTORY_DB_PASSWORD:?Run configure}"
      CUSTOMER_DB_PASSWORD: "${CUSTOMER_DB_PASSWORD:?Run configure}"
      ORDERS_DB_PASSWORD: "${ORDERS_DB_PASSWORD:?Run configure}"
      PAYMENT_DB_PASSWORD: "${PAYMENT_DB_PASSWORD:?Run configure}"
      FULFILLMENT_DB_PASSWORD: "${FULFILLMENT_DB_PASSWORD:?Run configure}"
      CDC_DB_PASSWORD: "${CDC_DB_PASSWORD:?Run configure}"
      ORDER_HISTORY_DB_PASSWORD: "${ORDER_HISTORY_DB_PASSWORD:?Run configure}"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./devops/postgres/init.sh:/docker-entrypoint-initdb.d/10-supersports.sh:ro
      - ./devops/postgres/provision.sql:/opt/supersports/provision.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    cap_drop: [NET_RAW]
    security_opt: ["no-new-privileges:true"]

  identity:
    image: "${KEYCLOAK_IMAGE:?Use devops/scripts/supersports}"
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/identity
      KC_DB_USERNAME: supersports_identity
      KC_DB_PASSWORD: "${IDENTITY_DB_PASSWORD:?Run configure}"
      KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?Run configure}"
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "-Xms64m -Xmx384m"
      DEMO_CUSTOMER_PASSWORD: "${DEMO_CUSTOMER_PASSWORD:?Run configure}"
      DEMO_PLATFORM_ADMIN_PASSWORD: "${DEMO_PLATFORM_ADMIN_PASSWORD:?Run configure}"
      DEMO_CATALOG_ADMIN_PASSWORD: "${DEMO_CATALOG_ADMIN_PASSWORD:?Run configure}"
      DEMO_INVENTORY_OPERATOR_PASSWORD: "${DEMO_INVENTORY_OPERATOR_PASSWORD:?Run configure}"
    ports: ["127.0.0.1:8180:8080"]
    volumes:
      - ./devops/identity/supersports-realm.json:/opt/keycloak/data/import/supersports-realm.json:ro
      - ./devops/identity/supersports-customers-realm.json:/opt/keycloak/data/import/supersports-customers-realm.json:ro
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000;
          printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          IFS= read -r status <&3; [[ "$$status" == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 60s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  catalog:
    <<: *app-runtime
    image: "${CATALOG_IMAGE:?Use devops/scripts/supersports}"
    build:
      context: .
      dockerfile: devops/docker/commerce.Dockerfile
      args:
        BUILD_IMAGE: "${BUILD_IMAGE:?Use devops/scripts/supersports}"
        JAVA_IMAGE: "${JAVA_IMAGE:?Use devops/scripts/supersports}"
        SERVICE_NAME: catalog
        RELEASE_VERSION: "${RELEASE_VERSION:-s1-m02}"
    environment:
      <<: *app-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog
      SPRING_DATASOURCE_USERNAME: supersports_catalog
      SPRING_DATASOURCE_PASSWORD: "${CATALOG_DB_PASSWORD:?Run configure}"
    ports: ["127.0.0.1:8081:8080"]

  configuration:
    <<: *app-runtime
    image: "${CONFIGURATION_IMAGE:?Use devops/scripts/supersports}"
    build:
      context: .
      dockerfile: devops/docker/commerce.Dockerfile
      args:
        BUILD_IMAGE: "${BUILD_IMAGE:?Use devops/scripts/supersports}"
        JAVA_IMAGE: "${JAVA_IMAGE:?Use devops/scripts/supersports}"
        SERVICE_NAME: configuration
        RELEASE_VERSION: "${RELEASE_VERSION:-s1-m02}"
    environment:
      <<: *app-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/configuration
      SPRING_DATASOURCE_USERNAME: supersports_configuration
      SPRING_DATASOURCE_PASSWORD: "${CONFIGURATION_DB_PASSWORD:?Run configure}"
    ports: ["127.0.0.1:8082:8080"]

  pricing:
    <<: *app-runtime
    image: "${PRICING_IMAGE:?Use devops/scripts/supersports}"
    build:
      context: .
      dockerfile: devops/docker/commerce.Dockerfile
      args:
        BUILD_IMAGE: "${BUILD_IMAGE:?Use devops/scripts/supersports}"
        JAVA_IMAGE: "${JAVA_IMAGE:?Use devops/scripts/supersports}"
        SERVICE_NAME: pricing
        RELEASE_VERSION: "${RELEASE_VERSION:-s1-m03}"
    environment:
      <<: *app-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pricing
      SPRING_DATASOURCE_USERNAME: supersports_pricing
      SPRING_DATASOURCE_PASSWORD: "${PRICING_DB_PASSWORD:?Run configure}"
    ports: ["127.0.0.1:8083:8080"]

  inventory:
    <<: *app-runtime
    image: "${INVENTORY_IMAGE:?Use devops/scripts/supersports}"
    build:
      context: .
      dockerfile: devops/docker/commerce.Dockerfile
      args:
        BUILD_IMAGE: "${BUILD_IMAGE:?Use devops/scripts/supersports}"
        JAVA_IMAGE: "${JAVA_IMAGE:?Use devops/scripts/supersports}"
        SERVICE_NAME: inventory
        RELEASE_VERSION: "${RELEASE_VERSION:-s1-m03}"
    environment:
      <<: *app-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory
      SPRING_DATASOURCE_USERNAME: supersports_inventory
      SPRING_DATASOURCE_PASSWORD: "${INVENTORY_DB_PASSWORD:?Run configure}"
      CATALOG_BASE_URL: http://catalog:8080
    ports: ["127.0.0.1:8084:8080"]

  customer:
    <<: *app-runtime
    image: "${CUSTOMER_IMAGE:?Use devops/scripts/supersports}"
    build:
      context: .
      dockerfile: devops/docker/commerce.Dockerfile
      args:
        BUILD_IMAGE: "${BUILD_IMAGE:?Use devops/scripts/supersports}"
        JAVA_IMAGE: "${JAVA_IMAGE:?Use devops/scripts/supersports}"
        SERVICE_NAME: customer
        RELEASE_VERSION: "${RELEASE_VERSION:-s1-m04}"
    environment:
      <<: *app-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/customer
      SPRING_DATASOURCE_USERNAME: supersports_customer
      SPRING_DATASOURCE_PASSWORD: "${CUSTOMER_DB_PASSWORD:?Run configure}"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "http://localhost:8180/realms/supersports-customers"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "http://identity:8080/realms/supersports-customers/protocol/openid-connect/certs"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES: "supersports-customer-api"
      CATALOG_BASE_URL: http://catalog:8080
    ports: ["127.0.0.1:8085:8080"]

  orders:
    <<: *app-runtime
    image: "${ORDERS_IMAGE:?Use devops/scripts/supersports}"
    build:
      context: .
      dockerfile: devops/docker/commerce.Dockerfile
      args:
        BUILD_IMAGE: "${BUILD_IMAGE:?Use devops/scripts/supersports}"
        JAVA_IMAGE: "${JAVA_IMAGE:?Use devops/scripts/supersports}"
        SERVICE_NAME: orders
        RELEASE_VERSION: "${RELEASE_VERSION:-s1-m05}"
    environment:
      <<: *app-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
      SPRING_DATASOURCE_USERNAME: supersports_orders
      SPRING_DATASOURCE_PASSWORD: "${ORDERS_DB_PASSWORD:?Run configure}"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "http://localhost:8180/realms/supersports-customers"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "http://identity:8080/realms/supersports-customers/protocol/openid-connect/certs"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES: "supersports-customer-api"
      CHECKOUT_WORKER_CLIENT_ID: supersports-checkout-worker
      CHECKOUT_WORKER_CLIENT_SECRET: "${CHECKOUT_WORKER_CLIENT_SECRET:?Run configure}"
      ORDER_HISTORY_OWNER_KEY: "${ORDER_HISTORY_OWNER_KEY:?Run configure}"
      CUSTOMER_BASE_URL: http://customer:8080
      CATALOG_BASE_URL: http://catalog:8080
      PRICING_BASE_URL: http://pricing:8080
      CONFIGURATION_BASE_URL: http://configuration:8080
      INVENTORY_BASE_URL: http://inventory:8080
      PAYMENT_BASE_URL: http://payment-simulator:8080
      FULFILLMENT_BASE_URL: http://fulfillment-simulator:8080
      IDENTITY_TOKEN_URL: http://identity:8080/realms/supersports/protocol/openid-connect/token
    ports: ["127.0.0.1:8086:8080"]

  payment-simulator:
    <<: *app-runtime
    image: "${PAYMENT_SIMULATOR_IMAGE:?Use devops/scripts/supersports}"
    build:
      context: .
      dockerfile: devops/docker/commerce.Dockerfile
      args: {BUILD_IMAGE: "${BUILD_IMAGE:?Use devops/scripts/supersports}", JAVA_IMAGE: "${JAVA_IMAGE:?Use devops/scripts/supersports}", SERVICE_NAME: payment-simulator, RELEASE_VERSION: "${RELEASE_VERSION:-s1-m05}"}
    environment:
      <<: *app-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment
      SPRING_DATASOURCE_USERNAME: supersports_payment
      SPRING_DATASOURCE_PASSWORD: "${PAYMENT_DB_PASSWORD:?Run configure}"
    ports: ["127.0.0.1:8087:8080"]

  fulfillment-simulator:
    <<: *app-runtime
    image: "${FULFILLMENT_SIMULATOR_IMAGE:?Use devops/scripts/supersports}"
    build:
      context: .
      dockerfile: devops/docker/commerce.Dockerfile
      args: {BUILD_IMAGE: "${BUILD_IMAGE:?Use devops/scripts/supersports}", JAVA_IMAGE: "${JAVA_IMAGE:?Use devops/scripts/supersports}", SERVICE_NAME: fulfillment-simulator, RELEASE_VERSION: "${RELEASE_VERSION:-s1-m05}"}
    environment:
      <<: *app-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fulfillment
      SPRING_DATASOURCE_USERNAME: supersports_fulfillment
      SPRING_DATASOURCE_PASSWORD: "${FULFILLMENT_DB_PASSWORD:?Run configure}"
    ports: ["127.0.0.1:8088:8080"]

  storefront:
    restart: unless-stopped
    image: "${STOREFRONT_IMAGE:?Use devops/scripts/supersports}"
    build:
      context: .
      dockerfile: devops/docker/storefront.Dockerfile
      args:
        NODE_IMAGE: "${STOREFRONT_NODE_IMAGE:?Use devops/scripts/supersports}"
        NGINX_IMAGE: "${STOREFRONT_NGINX_IMAGE:?Use devops/scripts/supersports}"
    mem_limit: 128m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16777216
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      catalog: {condition: service_healthy}
      pricing: {condition: service_healthy}
      inventory: {condition: service_healthy}
      customer: {condition: service_healthy}
      orders: {condition: service_healthy}
      identity: {condition: service_healthy}
    ports: ["127.0.0.1:3000:8080"]

  kafka:
    profiles: ["streaming"]
    image: "${KAFKA_IMAGE:?Use devops/scripts/supersports}"
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx768m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    ports: ["127.0.0.1:9092:9092"]

  kafka-connect:
    profiles: ["streaming"]
    image: "${DEBEZIUM_CONNECT_IMAGE:?Use devops/scripts/supersports}"
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: "supersports-connect"
      CONFIG_STORAGE_TOPIC: "supersports-connect-configs"
      OFFSET_STORAGE_TOPIC: "supersports-connect-offsets"
      STATUS_STORAGE_TOPIC: "supersports-connect-status"
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_REST_PORT: "8083"
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /kafka/connect,/kafka/connect/debezium-connector-postgres
      HEAP_OPTS: "-Xms128m -Xmx512m"
    depends_on:
      kafka: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    ports: ["127.0.0.1:8090:8083"]

  order-history:
    profiles: ["streaming"]
    image: "${ORDER_HISTORY_IMAGE:?Use devops/scripts/supersports}"
    build:
      context: .
      dockerfile: devops/docker/commerce.Dockerfile
      args:
        BUILD_IMAGE: "${BUILD_IMAGE:?Use devops/scripts/supersports}"
        JAVA_IMAGE: "${JAVA_IMAGE:?Use devops/scripts/supersports}"
        SERVICE_NAME: order-history
        RELEASE_VERSION: "${RELEASE_VERSION:-s1-m06}"
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m -XX:MaxMetaspaceSize=128m"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${ORDER_HISTORY_DATABASE_NAME:-order_history}"
      ORDER_HISTORY_CONSUMER_GROUP: "${ORDER_HISTORY_CONSUMER_GROUP:-order-history-v1}"
      SPRING_DATASOURCE_USERNAME: supersports_order_history
      SPRING_DATASOURCE_PASSWORD: "${ORDER_HISTORY_DB_PASSWORD:?Run configure}"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "http://localhost:8180/realms/supersports-customers"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "http://identity:8080/realms/supersports-customers/protocol/openid-connect/certs"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES: "supersports-customer-api"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ORDER_HISTORY_OWNER_KEY: "${ORDER_HISTORY_OWNER_KEY:?Run configure}"
      ORDER_HISTORY_FAULT_DIRECTORY: /tmp/order-history-fault
      ORDER_HISTORY_OPERATOR_ENABLED: "true"
    depends_on:
      postgres: {condition: service_healthy}
      identity: {condition: service_healthy}
      kafka: {condition: service_healthy}
    ports: ["127.0.0.1:8089:8080"]

volumes:
  postgres-data:
  kafka-data:
