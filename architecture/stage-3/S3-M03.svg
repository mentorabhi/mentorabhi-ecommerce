<text x="60" y="92.0" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#64748b">MentorAbhi • Architecture proposal • Editable components and connectors • v1</text>
<polyline points="740.0,247 740.0,330" fill="none" stroke="#334155" stroke-width="1.5"  marker-end="url(#arrow)"/>
<text x="740.0" y="277.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#475569">create</text>
<polyline points="740.0,442 740.0,525" fill="none" stroke="#334155" stroke-width="1.5"  marker-end="url(#arrow)"/>
<text x="740.0" y="472.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#475569">display</text>
<polyline points="740.0,637 740.0,720" fill="none" stroke="#334155" stroke-width="1.5"  marker-end="url(#arrow)"/>
<text x="740.0" y="667.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#475569">approve</text>
<polyline points="740.0,832 740.0,915" fill="none" stroke="#334155" stroke-width="1.5"  marker-end="url(#arrow)"/>
<text x="740.0" y="862.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#475569">execute allowed action</text>
<polyline points="740.0,1027 740.0,1110" fill="none" stroke="#334155" stroke-width="1.5"  marker-end="url(#arrow)"/>
<text x="740.0" y="1057.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#475569">record outcome</text>
<rect x="565.0" y="135" width="350" height="112" rx="12" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/>
<text x="740.0" y="186.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">Agent proposes action</text>
<text x="740.0" y="209.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">Cart / order / return</text>
<rect x="565.0" y="330" width="350" height="112" rx="12" fill="#fef3c7" stroke="#334155" stroke-width="1.5"/>
<text x="740.0" y="381.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">Persisted action proposal</text>
<text x="740.0" y="404.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">User / items / price / expiry</text>
<rect x="565.0" y="525" width="350" height="112" rx="12" fill="#dbeafe" stroke="#334155" stroke-width="1.5"/>
<text x="740.0" y="576.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">Customer approval</text>
<text x="740.0" y="599.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">Review actual action</text>
<rect x="565.0" y="720" width="350" height="112" rx="12" fill="#fee2e2" stroke="#334155" stroke-width="1.5"/>
<text x="740.0" y="771.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">Revalidate + authorize</text>
<text x="740.0" y="794.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">Changed terms require reapproval</text>
<rect x="565.0" y="915" width="350" height="112" rx="12" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/>
<text x="740.0" y="966.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">Commerce API + Saga</text>
<text x="740.0" y="989.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">Idempotency / recovery</text>
<rect x="565.0" y="1110" width="350" height="112" rx="12" fill="#fef3c7" stroke="#334155" stroke-width="1.5"/>
<text x="740.0" y="1161.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">Persist outcome + resume</text>
<text x="740.0" y="1184.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">Confirmed / failed / pending</text>
<text x="60" y="1284.0" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#334155">An expired or stale proposal cannot authorize a different purchase. Decline/expiry ends or revises the proposal; worker restart</text>
<text x="60" y="1305.25" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#334155">resumes from durable state.</text>
<text x="60" y="1355.0" text-anchor="start" font-family="Arial,sans-serif" font-size="14" fill="#64748b">Blue: user interface   Green: application   Yellow: data   Purple: infrastructure   Red: control / policy   Dashed: asynchronous event</text>
</svg>