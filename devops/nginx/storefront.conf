worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:8180; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;

        location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
        resolver 127.0.0.11 valid=5s ipv6=off;
        location /api/catalog/ { set $catalog_backend catalog:8080; rewrite ^/api/catalog/(.*)$ /api/v1/catalog/$1 break; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $http_authorization; proxy_pass http://$catalog_backend; }
        location /api/pricing/ { set $pricing_backend pricing:8080; rewrite ^/api/pricing/(.*)$ /api/v1/pricing/$1 break; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $http_authorization; proxy_pass http://$pricing_backend; }
        location /api/inventory/ { set $inventory_backend inventory:8080; rewrite ^/api/inventory/(.*)$ /api/v1/inventory/$1 break; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $http_authorization; proxy_pass http://$inventory_backend; }
        location = /api/configuration { set $configuration_backend configuration:8080; rewrite ^ /api/v1/configuration break; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $http_authorization; proxy_pass http://$configuration_backend; }
        location /api/configuration/ { set $configuration_backend configuration:8080; rewrite ^/api/configuration/(.*)$ /api/v1/configuration/$1 break; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $http_authorization; proxy_pass http://$configuration_backend; }
        location /api/customer/ { set $customer_backend customer:8080; rewrite ^/api/customer/(.*)$ /api/v1/customer/$1 break; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $http_authorization; proxy_pass http://$customer_backend; }
        location = /api/order-history { set $history_backend order-history:8080; rewrite ^ /api/v1/order-history break; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $http_authorization; proxy_pass http://$history_backend; }
        location /api/order-history/ { set $history_backend order-history:8080; rewrite ^/api/order-history/(.*)$ /api/v1/order-history/$1 break; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $http_authorization; proxy_pass http://$history_backend; }
        location = /api/orders { set $orders_backend orders:8080; rewrite ^ /api/v1/orders break; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $http_authorization; proxy_pass http://$orders_backend; }
        location /api/orders/ { set $orders_backend orders:8080; rewrite ^/api/orders/(.*)$ /api/v1/orders/$1 break; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $http_authorization; proxy_set_header Idempotency-Key $http_idempotency_key; proxy_pass http://$orders_backend; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
