openapi: 3.1.0
info: {title: SuperSports Orders API, version: 1.0.0}
servers: [{url: /api/v1/orders}]
security: [{customerBearer: []}]
paths:
  /checkout:
    post:
      summary: Validate current customer address, catalog facts, quote and checkout settings; create an owner-scoped immutable order snapshot idempotently
      parameters:
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 8, maxLength: 120}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines: {type: array, minItems: 1, maxItems: 50, items: {type: object, required: [skuId, quantity], properties: {skuId: {type: string, format: uuid}, quantity: {type: integer, minimum: 1, maximum: 100}}}}
                couponCode: {type: [string, 'null']}
      responses:
        '202': {description: Order snapshot created in PENDING_PAYMENT or same owner/key replayed}
        '409': {description: Idempotency key reused with changed payload}
        '422': {description: Invalid cart, incomplete Indian address, inactive SKU, or deterministic price/coupon rejection}
        '503': {description: Validation dependency unavailable; request claim can resume after its lease expires}
  /checkout-requests/{requestId}:
    get:
      summary: Read a checkout request owned by the authenticated customer
      parameters: [{in: path, name: requestId, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Request state}, '404': {description: Missing or not owned by caller}}
  /:
    get: {summary: List the authenticated customer's orders, responses: {'200': {description: Owner-scoped orders}}}
  /{orderId}:
    get:
      summary: Read an order owned by the authenticated customer
      parameters: [{in: path, name: orderId, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Immutable order snapshot}, '404': {description: Missing or not owned by caller}}
  /{orderId}/tracking:
    get:
      summary: Read owner-verified order and local simulator tracking state
      parameters: [{in: path, name: orderId, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Owned order state and synthetic shipment details; unavailable simulator is represented explicitly}, '404': {description: Missing or not owned by caller}}
  /{orderId}/verified-ownership:
    get:
      summary: Return minimal ownership proof for a linked support request
      responses: {'200': {description: Owned order identifier and state}, '404': {description: Missing or not owned by caller}}
  /{orderId}/verified-purchase/{skuId}:
    get:
      summary: Verify an owned delivered purchase for review submission
      responses: {'200': {description: Owned delivered order and SKU identifiers}, '404': {description: Missing or not owned by caller}, '422': {description: Purchase has not been delivered}}
  /{orderId}/cancellation-eligibility:
    get:
      summary: Check whether an owned, scheduled order can still be cancelled before shipment handoff
      parameters: [{in: path, name: orderId, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Eligibility and reason code}, '404': {description: Missing or not owned by caller}, '503': {description: Fulfillment simulator is unavailable}}
  /{orderId}/cancellations:
    post:
      summary: Request an idempotent simulated cancellation; refund, restock, and shipment claim execute asynchronously
      parameters:
        - {in: path, name: orderId, required: true, schema: {type: string, format: uuid}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 1, maxLength: 120}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [reasonCode], properties: {reasonCode: {const: CUSTOMER_REQUEST}}}
      responses: {'202': {description: Cancellation operation accepted}, '404': {description: Missing or not owned by caller}, '409': {description: Order is not cancellable or idempotency conflict}, '503': {description: Fulfillment simulator is unavailable}}
  /{orderId}/cancellations/{operationId}:
    get:
      summary: Read an owned cancellation operation and its current step
      parameters:
        - {in: path, name: orderId, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: operationId, required: true, schema: {type: string, format: uuid}}
      responses: {'200': {description: Operation state}, '404': {description: Missing or not owned by caller}}
  /{orderId}/returns/eligibility:
    get:
      summary: Check delivered-order return window and remaining quantities for the authenticated customer
      parameters: [{in: path, name: orderId, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Return policy revision, eligibility reason and returnable order-line quantities}, '404': {description: Missing or not owned by caller}, '503': {description: Fulfillment or Configuration service unavailable}}
  /{orderId}/returns:
    post:
      summary: Claim partial return quantities under immutable refund allocation and request a simulated refund
      parameters:
        - {in: path, name: orderId, required: true, schema: {type: string, format: uuid}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 1, maxLength: 120}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [lines], properties: {lines: {type: array, minItems: 1, maxItems: 50, items: {type: object, required: [skuId, quantity], properties: {skuId: {type: string, format: uuid}, quantity: {type: integer, minimum: 1, maximum: 100}}}}}}
      responses: {'202': {description: Return and refund operation accepted}, '404': {description: Missing or not owned by caller}, '409': {description: Idempotency conflict or requested units already claimed}, '422': {description: Not delivered, return window expired or invalid lines}, '503': {description: Fulfillment or Configuration service unavailable}}
  /{orderId}/returns/{returnId}:
    get:
      summary: Read the authenticated customer's partial return, immutable allocation and simulated refund status
      parameters:
        - {in: path, name: orderId, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: returnId, required: true, schema: {type: string, format: uuid}}
      responses: {'200': {description: Owner-scoped return/refund state}, '404': {description: Missing or not owned by caller}}
components:
  securitySchemes:
    customerBearer: {type: http, scheme: bearer, bearerFormat: JWT, description: Customer realm token with supersports-customer-api audience}
