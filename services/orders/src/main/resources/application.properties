spring.application.name=orders
spring.datasource.username=supersports_orders
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.connection-timeout=3000
spring.flyway.locations=classpath:db/migration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/supersports-customers
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://identity:8080/realms/supersports-customers/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences=supersports-customer-api
customer.base-url=${CUSTOMER_BASE_URL:http://customer:8080}
catalog.base-url=${CATALOG_BASE_URL:http://catalog:8080}
pricing.base-url=${PRICING_BASE_URL:http://pricing:8080}
configuration.base-url=${CONFIGURATION_BASE_URL:http://configuration:8080}
inventory.base-url=${INVENTORY_BASE_URL:http://inventory:8080}
payment.base-url=${PAYMENT_BASE_URL:http://payment-simulator:8080}
fulfillment.base-url=${FULFILLMENT_BASE_URL:http://fulfillment-simulator:8080}
identity.token-url=${IDENTITY_TOKEN_URL:http://identity:8080/realms/supersports/protocol/openid-connect/token}
checkout.worker-client-id=${CHECKOUT_WORKER_CLIENT_ID:supersports-checkout-worker}
checkout.worker-client-secret=${CHECKOUT_WORKER_CLIENT_SECRET:}
checkout.worker-poll-ms=${CHECKOUT_WORKER_POLL_MS:1000}
checkout.worker-lease-seconds=${CHECKOUT_WORKER_LEASE_SECONDS:30}
order-history.owner-key=${ORDER_HISTORY_OWNER_KEY:}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
