receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 144
    spike_limit_mib: 32
  filter/request-logs:
    error_mode: propagate
    log_conditions:
      - 'scope.name != "supersports.http"'
      - 'log.body != "http_request"'
  filter/request-metrics:
    error_mode: propagate
    metric_conditions:
      - 'metric.name != "http.server.request.duration"'
  transform/privacy:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.version", "deployment.environment.name"])
      - context: span
        statements:
          - keep_keys(attributes, ["http.route", "http.request.method", "http.response.status_code", "db.system.name", "db.operation.name", "server.port"])
          - set(name, "operation")
          - set(name, attributes["http.route"]) where attributes["http.route"] != nil
          - set(name, attributes["db.operation.name"]) where attributes["db.operation.name"] != nil
          - set(status.message, "")
          - set(trace_state, "")
          - set(events, nil)
          - set(links, nil)
    metric_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.version", "deployment.environment.name"])
      - context: datapoint
        statements:
          - keep_keys(attributes, ["http.route", "http.request.method", "http.response.status_code"])
    log_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.version", "deployment.environment.name"])
      - context: log
        statements:
          - keep_keys(attributes, ["http.route", "http.request.method", "http.response.status_code", "elapsed_ms"])
          - set(body, "http_request")
          - set(attributes["trace_id"], trace_id.string)
  batch:
    timeout: 2s
    send_batch_size: 256
    send_batch_max_size: 512
exporters:
  prometheus:
    endpoint: 0.0.0.0:9464
    resource_to_telemetry_conversion:
      enabled: true
  otlp_http/tempo:
    endpoint: http://tempo:4318
    sending_queue: {queue_size: 256}
    retry_on_failure: {max_elapsed_time: 30s}
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    sending_queue: {queue_size: 256}
    retry_on_failure: {max_elapsed_time: 30s}
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy, batch]
      exporters: [otlp_http/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, filter/request-metrics, transform/privacy, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, filter/request-logs, transform/privacy, batch]
      exporters: [otlp_http/loki]
