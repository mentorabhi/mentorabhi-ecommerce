openapi: 3.1.0
info: {title: SuperSports Inventory API, version: 1.0.0}
servers: [{url: /api/v1/inventory}]
security: [{bearerAuth: []}]
paths:
  /availability/{skuId}:
    get: {summary: Read informational available-quantity snapshot, security: [], responses: {'200': {description: On-hand quantity; not a reservation}}}
  /warehouses:
    get: {summary: List active warehouses, responses: {'200': {description: Warehouses}}}
  /balances:
    get: {summary: List warehouse SKU on-hand projections, responses: {'200': {description: On-hand quantities}}}
  /movements:
    get: {summary: Read recent stock movements, responses: {'200': {description: Append-only ledger entries}}}
  /adjustments:
    post: {summary: Append an idempotent signed stock adjustment after Catalog validation, responses: {'200': {description: Movement and balance}, '409': {description: Idempotency conflict}, '422': {description: Inactive SKU or negative stock}}}
  /api/v1/internal/checkout/inventory/reservations:
    servers: [{url: /}]
    post: {summary: Atomically reserve all order SKU quantities; checkout worker scope and positive fencing token required, responses: {'200': {description: Reservation result}, '409': {description: Insufficient stock, stale fence or payload conflict}, '422': {description: Invalid expiry or quantity}}}
  /api/v1/internal/checkout/inventory/reservations/{orderId}/protect:
    servers: [{url: /}]
    post: {summary: Protect a live hold against expiry while payment is reconciled; requires X-Checkout-Fence, responses: {'200': {description: Protected reservation}, '404': {description: Reservation not found}, '409': {description: Invalid transition or stale fence}}}
  /api/v1/internal/checkout/inventory/reservations/{orderId}/commit:
    servers: [{url: /}]
    post: {summary: Consume a protected hold and decrement on-hand once; requires X-Checkout-Fence, responses: {'200': {description: Committed allocation}, '404': {description: Reservation not found}, '409': {description: Invalid transition or stale fence}}}
  /api/v1/internal/checkout/inventory/reservations/{orderId}/release:
    servers: [{url: /}]
    post: {summary: Release an uncommitted hold idempotently; requires X-Checkout-Fence, responses: {'200': {description: Released reservation}, '404': {description: Reservation not found}, '409': {description: Stale fence}}}
  /api/v1/internal/checkout/inventory/reservations/{orderId}/cancel:
    servers: [{url: /}]
    post:
      summary: Restore quantities for one committed reservation exactly once after an accepted cancellation
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [operationId, fence], properties: {operationId: {type: string, format: uuid}, fence: {type: integer, minimum: 1}}}}}}
      responses: {'200': {description: Reservation reversed and stock movement appended}, '404': {description: Reservation not found}, '409': {description: Reservation is not committed or fence is stale}}
  /api/v1/internal/checkout/inventory/returns/{returnId}/receive:
    servers: [{url: /}]
    post:
      summary: Idempotently register the exact refunded return unit manifest for Inventory inspection
      security: [{checkoutWorker: [checkout:inventory.return.receive]}]
      parameters: [{in: path, name: returnId, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [orderId, units], properties: {orderId: {type: string, format: uuid}, units: {type: array, minItems: 1, maxItems: 5000, items: {type: object, required: [skuId, ordinal], properties: {skuId: {type: string, format: uuid}, ordinal: {type: integer, minimum: 0}}}}}}
      responses: {'200': {description: Inventory receipt and revision}, '409': {description: Return ID reused with a changed manifest}, '422': {description: Invalid or duplicate return unit}}
  /returns/pending:
    get: {summary: List return units awaiting operator inspection, responses: {'200': {description: Inventory-owned return receipts and revision}}}
  /returns/{returnId}/inspection:
    post:
      summary: Record a complete revisioned inspection and restock sellable units exactly once
      parameters: [{in: path, name: returnId, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [expectedRevision, operationId, decisions], properties: {expectedRevision: {type: integer, minimum: 0}, operationId: {type: string, format: uuid}, decisions: {type: array, minItems: 1, items: {type: object, required: [skuId, ordinal, condition, reason], properties: {skuId: {type: string, format: uuid}, ordinal: {type: integer, minimum: 0}, condition: {type: string, enum: [SELLABLE, DAMAGED, DISPUTED]}, reason: {type: string, minLength: 1, maxLength: 500}}}}}}
      responses: {'200': {description: Inspection receipt and new revision}, '404': {description: Inventory receipt not found}, '409': {description: Stale revision, duplicate operation conflict or already inspected}, '422': {description: Inspection must cover each received unit exactly once}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
    checkoutWorker: {type: http, scheme: bearer, bearerFormat: JWT, description: Worker client, internal audience, and required inventory manifest scope}
