openapi: 3.1.0
info: {title: SuperSports Reviews API, version: 1.1.0}
servers: [{url: /api/v1}]
paths:
  /reviews/products/summaries:
    get:
      parameters: [{in: query, name: productIds, required: true, style: form, explode: false, schema: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: string, format: uuid}}}]
      responses:
        '200': {description: Published-only aggregates, content: {application/json: {schema: {$ref: './public.schema.json#/$defs/RatingSummaries'}}}}
        '422': {description: Duplicate or oversized product batch}
  /operator/reviews/demo-seed:
    post:
      security: [{operator: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './public.schema.json#/$defs/DemoSeed'}}}}
      responses: {'200': {description: Persisted receipt with replay flag}, '409': {description: Changed operation identity}, '422': {description: Invalid seed}}
  /operator/reviews:
    get:
      security: [{operator: []}]
      parameters:
        - {in: query, name: state, schema: {enum: [PENDING, PUBLISHED, HIDDEN, REJECTED], default: PENDING}}
        - {in: query, name: productId, schema: {type: string, format: uuid}}
      responses: {'200': {description: At most 200 matching moderation rows}, '422': {description: Invalid state}}
  /reviews/products/{productId}:
    get:
      summary: Published product reviews
      parameters: [{in: path, name: productId, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Published reviews with origin badges and no private identifiers, content: {application/json: {schema: {$ref: './public.schema.json#/$defs/PublishedReviews'}}}}}
  /customer/reviews:
    get: {security: [{customer: []}], responses: {'200': {description: Reviews owned by the token subject}}}
    post:
      security: [{customer: []}]
      summary: Submit an owned delivered purchase review
      responses: {'201': {description: Pending moderation}, '404': {description: Purchase is not owned}, '409': {description: Review already exists}}
  /operator/reviews/pending:
    get: {security: [{operator: []}], responses: {'200': {description: Pending moderation queue}}}
  /operator/reviews/{id}/moderation:
    parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
    post: {security: [{operator: []}], responses: {'200': {description: Audited decision}, '409': {description: Conflicting operation or state}}}
components:
  securitySchemes:
    customer: {type: http, scheme: bearer}
    operator: {type: http, scheme: bearer}
