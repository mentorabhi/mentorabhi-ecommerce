{{- $root := . -}}
{{- range $name, $app := .Values.apps }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "supersports.prefix" $root }}-{{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ $root.Release.Name | quote }}, app.kubernetes.io/component: {{ $name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ $root.Release.Name | quote }}, app.kubernetes.io/component: {{ $name }}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ $name }}
          image: {{ $app.image | quote }}
          imagePullPolicy: {{ $app.imagePullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - {name: SERVER_PORT, value: "8080"}
            - {name: JAVA_TOOL_OPTIONS, value: "-Xmx192m -Djava.io.tmpdir=/tmp"}
            - name: SPRING_DATASOURCE_URL
              value: {{ printf "jdbc:postgresql://%s-postgres:5432/%s" (include "supersports.prefix" $root) $app.database | quote }}
            - {name: SPRING_DATASOURCE_USERNAME, value: {{ $app.username | quote }}}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "supersports.secret" $root | quote }}, key: {{ $app.passwordKey }}}
            - {name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI, value: {{ $root.Values.publicIssuer | quote }}}
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: {{ printf "http://%s-identity:8080/realms/supersports/protocol/openid-connect/certs" (include "supersports.prefix" $root) | quote }}
            - {name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES, value: supersports-api}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 5
          resources: {{ toYaml $app.resources | nindent 12 }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "supersports.prefix" $root }}-{{ $name }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ $root.Release.Name | quote }}, app.kubernetes.io/component: {{ $name }}}
  ports: [{name: http, port: 8080, targetPort: http}]
{{- end }}
