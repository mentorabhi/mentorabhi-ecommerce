spring.application.name=catalog
spring.datasource.username=supersports_catalog
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=3000
spring.flyway.locations=classpath:db/migration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/supersports
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://identity:8080/realms/supersports/protocol/openid-connect/certs
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
pricing.base-url=http://pricing:8080
