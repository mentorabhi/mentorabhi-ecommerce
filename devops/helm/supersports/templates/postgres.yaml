apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "supersports.prefix" . }}-postgres
spec:
  serviceName: {{ include "supersports.prefix" . }}-postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name | quote }}, app.kubernetes.io/component: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name | quote }}, app.kubernetes.io/component: postgres}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: PGDATA, value: /var/lib/postgresql/18/docker}
            - {name: POSTGRES_USER, value: postgres}
            - {name: POSTGRES_DB, value: postgres}
{{- range $key := list "POSTGRES_PASSWORD" "CATALOG_DB_PASSWORD" "CONFIGURATION_DB_PASSWORD" "IDENTITY_DB_PASSWORD" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef: {name: {{ include "supersports.secret" $ | quote }}, key: {{ $key }}}
{{- end }}
          readinessProbe:
            exec: {command: [pg_isready, -h, '127.0.0.1', -U, postgres, -d, postgres]}
            periodSeconds: 5
          resources: {{ toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: init
          configMap:
            name: {{ required "bootstrap.postgresExistingConfigMap is required" .Values.bootstrap.postgresExistingConfigMap | quote }}
            items: [{key: init.sh, path: init.sh}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: {{ .Values.postgres.storage | quote }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "supersports.prefix" . }}-postgres
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ .Release.Name | quote }}, app.kubernetes.io/component: postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
