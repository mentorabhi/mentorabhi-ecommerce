spring.application.name=customer
spring.datasource.username=supersports_customer
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=3000
spring.flyway.locations=classpath:db/migration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/supersports-customers
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://identity:8080/realms/supersports-customers/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences=supersports-customer-api
catalog.base-url=http://catalog:8080
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
