openapi: 3.1.0
info: {title: SuperSports local Fulfillment Simulator API, version: 1.0.0}
servers: [{url: /api/v1}]
paths:
  /internal/checkout/fulfillment:
    post:
      summary: Idempotently schedule one local shipment after order confirmation
      security: [{checkoutWorker: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [orderId, fence, operationKey], properties: {orderId: {type: string, format: uuid}, fence: {type: integer, minimum: 1}, operationKey: {type: string, maxLength: 200}}}}}}
      responses: {'200': {description: Scheduled shipment and synthetic tracking ID}, '409': {description: Stale fence or operation conflict}}
  /internal/checkout/fulfillment/{orderId}:
    get:
      summary: Read shipment state through the checkout worker service identity
      security: [{checkoutWorker: []}]
      responses: {'200': {description: Shipment state, revision, synthetic ETA and transition history}}
  /internal/checkout/fulfillment/{orderId}/cancel-claim:
    post:
      summary: Atomically claim cancellation while shipment remains scheduled and before handoff
      security: [{checkoutWorker: []}]
      parameters: [{in: path, name: orderId, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [expectedRevision, operationId], properties: {expectedRevision: {type: integer, minimum: 0}, operationId: {type: string, format: uuid}}}}}}
      responses: {'200': {description: Cancellation claim receipt}, '404': {description: Shipment not found}, '409': {description: Handoff won or shipment revision changed}}
  /internal/checkout/fulfillment/{orderId}/cancel-finalize:
    post:
      summary: Finalize cancellation after refund and restock succeed
      security: [{checkoutWorker: []}]
      parameters: [{in: path, name: orderId, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [claimOperationId, operationId], properties: {claimOperationId: {type: string, format: uuid}, operationId: {type: string, format: uuid}}}}}}
      responses: {'200': {description: Cancelled shipment receipt}, '404': {description: Shipment not found}, '409': {description: Claim is no longer valid}}
  /operator/shipments/{orderId}/transitions:
    post:
      summary: Advance one deterministic simulated shipment milestone
      security: [{operatorBearer: []}]
      parameters: [{in: path, name: orderId, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision, operationId, targetState, reason]
              properties:
                expectedRevision: {type: integer, minimum: 0}
                operationId: {type: string, format: uuid}
                targetState: {type: string, enum: [HANDED_OFF, IN_TRANSIT, DELIVERED]}
                reason: {type: string, minLength: 1, maxLength: 500}
      responses: {'200': {description: Idempotent transition receipt}, '404': {description: Shipment not found}, '409': {description: Stale revision, operation conflict or invalid state transition}, '422': {description: Invalid transition request}}
  /operator/shipments/{orderId}:
    get:
      summary: Read one shipment state and its operator audit history
      security: [{operatorBearer: []}]
      parameters: [{in: path, name: orderId, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Synthetic tracking state, revision, ETA and transitions}, '404': {description: Shipment not found}}
components:
  securitySchemes:
    checkoutWorker: {type: http, scheme: bearer, bearerFormat: JWT, description: Exact checkout client, internal audience and fulfillment scope}
    operatorBearer: {type: http, scheme: bearer, bearerFormat: JWT, description: Local operator token with supersports-api audience}
