global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: supersports-local-health
    metrics_path: /metrics
    static_configs:
      - targets: ["health-exporter:9108"]
