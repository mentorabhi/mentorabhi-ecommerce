spring.application.name=order-history
spring.datasource.username=supersports_order_history
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=3000
spring.flyway.locations=classpath:db/migration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/supersports-customers
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://identity:8080/realms/supersports-customers/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences=supersports-customer-api
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
order-history.owner-key=${ORDER_HISTORY_OWNER_KEY:}
order-history.topic=${ORDER_HISTORY_TOPIC:commerce.order.events.v1}
order-history.dlq-topic=${ORDER_HISTORY_DLQ_TOPIC:commerce.order.events.dlq.v1}
order-history.consumer-group=${ORDER_HISTORY_CONSUMER_GROUP:order-history-v1}
order-history.fault-directory=${ORDER_HISTORY_FAULT_DIRECTORY:/tmp/order-history-fault}
order-history.operator-enabled=${ORDER_HISTORY_OPERATOR_ENABLED:false}
order-history.rebuild-target=${ORDER_HISTORY_REBUILD_TARGET:false}
order-history.probe-interval-ms=${ORDER_HISTORY_PROBE_INTERVAL_MS:3000}
order-history.stale-after-seconds=${ORDER_HISTORY_STALE_AFTER_SECONDS:10}
order-history.gap-timeout-seconds=${ORDER_HISTORY_GAP_TIMEOUT_SECONDS:30}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
