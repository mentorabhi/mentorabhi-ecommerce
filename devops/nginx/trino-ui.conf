# Full nginx.conf. Run as the host credential-file owner's numeric UID:GID.
# Host publication must be 127.0.0.1:8096:8080; remove Trino's host port.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080;
        auth_basic "SuperSports Trino";
        auth_basic_user_file /etc/nginx/ui.htpasswd;
        resolver 127.0.0.11 valid=5s ipv6=off;
        location / {
            set $backend trino:8080;
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # Trino rejects forwarded headers unless explicitly configured to
            # trust them; this loopback HTTP proxy needs no protocol rewrite.
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header Authorization "";
        }
    }
}
